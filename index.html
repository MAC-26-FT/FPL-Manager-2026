<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17365D"><link rel="manifest" href="manifest.webmanifest"><title>FPL Manager</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f4f7fb;margin:0;color:#17202a}header{background:#17365D;color:white;padding:18px}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 2px 8px #0001}.row{padding:10px 0;border-bottom:1px solid #eee}.metric{font-size:28px;font-weight:800}button{padding:10px 14px;border:0;border-radius:9px;background:#17365D;color:#fff;font-weight:700}input{padding:11px;width:100%;box-sizing:border-box;border:1px solid #ccd4df;border-radius:9px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:8px;display:flex;gap:5px}nav button{flex:1;font-size:11px}</style></head><body><header><b>FPL Manager</b><div id="status">Loading</div></header><main><div class="card"><button onclick="refresh()">Refresh official FPL data</button></div><div class="card"><h3>Top 8-GW opportunities</h3><div id="rank"></div></div><div class="card"><h3>Captaincy</h3><div id="cap"></div></div><div class="card"><h3>Security</h3><small>No FPL password is requested or stored. The app only reads public FPL data and local browser storage. Use HTTPS and keep iOS/Safari updated.</small></div></main><script src="model.js"></script><script>
const A="https://fantasy.premierleague.com/api";let S={};
async function refresh(){try{const[b,f]=await Promise.all([fetch(A+"/bootstrap-static/").then(x=>x.json()),fetch(A+"/fixtures/").then(x=>x.json())]);S={b,f};localStorage.setItem("fpl_b",JSON.stringify(b));localStorage.setItem("fpl_f",JSON.stringify(f));render()}catch(e){document.getElementById("status").textContent="Refresh failed: "+e.message}}
function render(){const gw=S.b.events.find(x=>x.is_current)||S.b.events.find(x=>x.is_next);const ps=S.b.elements.filter(p=>p.status!=="u").map(p=>FPLModel.project(p,S.f,gw.id)).sort((a,b)=>b.eight-a.eight);document.getElementById("status").textContent="GW "+gw.id+" • refreshed "+new Date().toLocaleString();document.getElementById("rank").innerHTML=ps.slice(0,15).map((p,i)=>`<div class="row"><b>${i+1}. ${p.web_name}</b><br><small>6GW ${p.six.toFixed(1)} • 8GW ${p.eight.toFixed(1)} • £m ${p.value.toFixed(2)} • minutes risk ${(p.risk*100).toFixed(0)}%</small></div>`).join("");document.getElementById("cap").innerHTML=FPLModel.captainProb(ps.slice(0,15)).sort((a,b)=>b.captProb-a.captProb).slice(0,8).map((p,i)=>`<div class="row"><b>${i+1}. ${p.web_name}</b> — ${(p.captProb*100).toFixed(1)}%</div>`).join("")}
try{S.b=JSON.parse(localStorage.getItem("fpl_b"));S.f=JSON.parse(localStorage.getItem("fpl_f"));if(S.b)render();else refresh()}catch(e){refresh()}
</script></body></html>
